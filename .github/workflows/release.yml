name: Release

# 推送形如 v0.1.0 的标签时触发，自动在三平台构建并生成草稿 Release。
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest    # Apple Silicon (arm64)
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest    # Intel (x64)
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'z-switch ${{ github.ref_name }}'
          releaseBody: |
            ## z-switch ${{ github.ref_name }}

            下载对应平台的安装包：
            - **Windows**：`.exe`（NSIS 安装器）
            - **macOS**：`.dmg`（区分 Apple Silicon / Intel）
            - **Linux**：`.AppImage` / `.deb`

            ### macOS 提示「已损坏，无法打开」
            安装包使用 ad-hoc 签名，未经 Apple 公证，首次打开会被 Gatekeeper 拦截。把 z-switch 拖进「应用程序」后，在终端执行：

            ```bash
            xattr -dr com.apple.quarantine /Applications/z-switch.app
            ```

            之后即可正常打开。也可以先双击一次，再到「系统设置 → 隐私与安全性」底部点「仍要打开」。

            > Windows 安装包同样未做代码签名，SmartScreen 提示时点「更多信息 → 仍要运行」即可。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
